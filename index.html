<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the Engine</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e24; color: #eee; margin: 0;
         display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 1.3rem; margin: .2rem 0 .8rem; }
  .controls { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; margin-bottom: .8rem; }
  label { display: flex; align-items: center; gap: .35rem; font-size: .95rem; }
  select, button { padding: .4rem .7rem; border-radius: 6px; border: 1px solid #555;
                   background: #2d2d36; color: #eee; font-size: .95rem; }
  button { cursor: pointer; background: #3b6ef5; border-color: #3b6ef5; }
  button:hover { filter: brightness(1.1); }

  #board { --sz: min(11.5vw, 72px); display: grid; border: 4px solid #444; border-radius: 4px;
           grid-template-columns: repeat(8, var(--sz)); grid-template-rows: repeat(8, var(--sz)); }
  .sq { width: var(--sz); height: var(--sz); display: flex; align-items: center; justify-content: center;
        font-size: calc(var(--sz) * .78); line-height: 1; position: relative; user-select: none; }
  .sq.light { background-color: #e8d9b5; }
  .sq.dark  { background-color: #a67c52; }
  .sq.clickable { cursor: pointer; }
  .sq.last  { background-image: linear-gradient(rgba(255,230,0,.4), rgba(255,230,0,.4)); }
  .sq.sel   { background-image: linear-gradient(rgba(0,200,80,.55), rgba(0,200,80,.55)); }
  .sq.check { background-image: radial-gradient(circle, rgba(255,0,0,.85), rgba(255,0,0,0) 72%); }
  .sq.target::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%;
                      background: rgba(0,0,0,.32); }
  .sq.target.cap::after { width: 86%; height: 86%; background: none; box-sizing: border-box;
                          border: 5px solid rgba(0,0,0,.32); }
  .piece.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000; }
  .piece.b { color: #111; text-shadow: 0 0 1px #fff; }

  #status { margin-top: .9rem; font-size: 1.1rem; min-height: 1.5em; }
  #info { margin-top: .2rem; font-size: .9rem; color: #aaa; min-height: 1.3em; }
  #err { color: #ff6b6b; margin-top: .3rem; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Play the Engine</h1>

<div class="controls">
  <label>Play as
    <select id="side"><option value="white">White</option><option value="black">Black</option></select>
  </label>
  <label>AI think time
    <select id="secs">
      <option value="0.3">0.3 s (easy)</option>
      <option value="1" selected>1 s</option>
      <option value="3">3 s</option>
      <option value="8">8 s (hard)</option>
      <option value="15">15 s (beats 1575)</option>
      <option value="15">60 s (super hard)</option>
    </select>
  </label>
  <button id="new">New game</button>
</div>

<div id="board"></div>
<div id="status"></div>
<div id="info"></div>
<div id="err"></div>

<script>
const GLYPH = { p: "\u265F\uFE0E", n: "\u265E", b: "\u265D", r: "\u265C", q: "\u265B", k: "\u265A" };
const $ = id => document.getElementById(id);
let state = null, selected = null, busy = false;

const name = sq => "abcdefgh"[sq % 8] + (Math.floor(sq / 8) + 1);
const isMine = ch => ch !== "." && (state.human === "w" ? ch === ch.toUpperCase() : ch === ch.toLowerCase());

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function render() {
  const boardEl = $("board");
  boardEl.innerHTML = "";
  const targets = new Set(state.legal.filter(m => m[0] === selected).map(m => m[1]));
  const myTurn = !busy && !state.winner && state.turn === state.human;

  for (let i = 0; i < 64; i++) {
    // White at the bottom when playing White, Black at the bottom when playing Black.
    const r = state.human === "w" ? 7 - Math.floor(i / 8) : Math.floor(i / 8);
    const c = state.human === "w" ? i % 8 : 7 - (i % 8);
    const sq = r * 8 + c;
    const ch = state.board[sq];

    const el = document.createElement("div");
    el.className = "sq " + ((r + c) % 2 === 0 ? "dark" : "light");
    el.title = name(sq);
    if (state.last && state.last.includes(sq)) el.classList.add("last");
    if (state.check.includes(sq)) el.classList.add("check");
    if (sq === selected) el.classList.add("sel");
    if (targets.has(sq)) el.classList.add("target", ...(ch !== "." ? ["cap"] : []));
    if (myTurn && (isMine(ch) || targets.has(sq))) el.classList.add("clickable");

    if (ch !== ".") {
      const p = document.createElement("span");
      p.className = "piece " + (ch === ch.toUpperCase() ? "w" : "b");
      p.textContent = GLYPH[ch.toLowerCase()];
      el.appendChild(p);
    }
    el.addEventListener("click", () => onClick(sq));
    boardEl.appendChild(el);
  }

  // Status line
  let status;
  const humanKing = state.human === "w" ? "K" : "k";
  if (state.winner === "draw") status = "Draw \u2013 no moves available.";
  else if (state.winner) status = state.winner === state.human ? "You win \u2013 king captured!" : "AI wins \u2013 your king was captured.";
  else if (busy || state.turn !== state.human) status = "AI is thinking\u2026";
  else status = state.check.includes(state.board.indexOf(humanKing)) ? "Your move \u2013 your king is in check!" : "Your move";
  $("status").textContent = status;

  $("info").textContent = state.ai
    ? `AI played ${name(state.ai.from)} \u2192 ${name(state.ai.to)} \u00b7 depth ${state.ai.depth} \u00b7 eval ${(state.ai.score / 100).toFixed(2)} (AI's view)`
    : "";
}

async function onClick(sq) {
  if (busy || state.winner || state.turn !== state.human) return;
  const ch = state.board[sq];
  if (selected !== null && state.legal.some(m => m[0] === selected && m[1] === sq)) {
    return makeMove(selected, sq);
  }
  selected = isMine(ch) && sq !== selected ? sq : null;
  render();
}

// Mirror the move locally (incl. castling and en passant) so the board updates instantly.
function applyLocal(board, from, to) {
  const b = board.slice(), piece = b[from].toLowerCase();
  if (piece === "k" && Math.abs((to % 8) - (from % 8)) === 2) {          // castling: move the rook too
    const row = from - (from % 8);
    if (to > from) { b[row + 5] = b[row + 7]; b[row + 7] = "."; }
    else           { b[row + 3] = b[row];     b[row] = ".";     }
  }
  if (piece === "p" && from % 8 !== to % 8 && b[to] === ".")              // en passant: remove the pawn
    b[state.human === "w" ? to - 8 : to + 8] = ".";
  b[to] = b[from]; b[from] = ".";
  return b;
}

async function makeMove(from, to) {
  busy = true;
  $("err").textContent = "";
  // Show the human's move immediately while the engine thinks.
  state = { ...state, board: applyLocal(state.board, from, to), last: [from, to], check: [], legal: [] };
  selected = null;
  render();
  try {
    state = await api("/api/move", { from, to });
  } catch (e) {
    $("err").textContent = e.message;
    state = await api("/api/state");
  }
  busy = false;
  render();
}

async function newGame() {
  busy = true;
  selected = null;
  $("err").textContent = "";
  $("status").textContent = "Starting\u2026";
  try {
    state = await api("/api/new", { side: $("side").value, seconds: parseFloat($("secs").value) });
  } catch (e) {
    $("err").textContent = e.message;
  }
  busy = false;
  if (state) render();
}

$("new").addEventListener("click", newGame);

(async () => {
  try {
    state = await api("/api/state");
    $("side").value = state.human === "w" ? "white" : "black";
    $("secs").value = String(state.seconds);
    render();
  } catch (e) {
    $("err").textContent = e.message;
  }
})();
</script>
</body>
</html>
